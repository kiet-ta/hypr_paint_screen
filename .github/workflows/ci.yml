name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-gtklayershell-0.1 \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libcairo2-dev

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment with uv
        run: |
          uv venv
          uv pip install ruff flake8 bandit pycairo PyGObject

      - name: Verify Python Syntax Compilation
        run: |
          uv run python3 -c "import py_compile; py_compile.compile('whiteboard.py', doraise=True)"

      - name: Code Linting with Ruff
        run: |
          uv run ruff check whiteboard.py

      - name: Security Scan with Bandit
        run: |
          uv run bandit -r whiteboard.py -ll

  headless-integration-test:
    name: Headless Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK3, Layer Shell & Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-gtklayershell-0.1 \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libcairo2-dev \
            xvfb

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create Python Virtual Environment with uv
        run: |
          uv venv
          uv pip install pycairo PyGObject

      - name: Run Headless Application Test
        run: |
          uv run xvfb-run -a python3 -c "
          import sys
          import gi
          gi.require_version('Gtk', '3.0')
          gi.require_version('cairo', '1.0')

          import whiteboard
          print('Whiteboard application imported and initialized cleanly!')
          "
