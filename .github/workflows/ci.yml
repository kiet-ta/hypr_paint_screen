name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 bandit

      - name: Verify Python Syntax Compilation
        run: |
          python3 -c "import py_compile; py_compile.compile('whiteboard.py', doraise=True)"

      - name: Code Linting with Ruff
        run: |
          ruff check . --ignore E501

      - name: Security Scan with Bandit
        run: |
          bandit -r whiteboard.py -ll

  headless-smoke-test:
    name: Headless Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK3 & Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            libcairo2-dev \
            libgirepository1.0-dev \
            xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyGObject & PyCairo
        run: |
          pip install --upgrade pip
          pip install pycairo PyGObject

      - name: Run Headless Import Test
        run: |
          xvfb-run -a python3 -c "
          import gi
          gi.require_version('Gtk', '3.0')
          gi.require_version('cairo', '1.0')
          from gi.repository import Gtk, Gdk, cairo
          print('GTK3 and Cairo successfully imported in headless environment!')
          "
